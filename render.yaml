services:
  - type: web
    name: ids-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: ENV
        value: production
    healthCheckPath: /health

  - type: web
    name: ids-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://ids-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
