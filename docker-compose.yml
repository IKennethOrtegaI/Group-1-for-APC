version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ids_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ids_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
